services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale
    volumes:
      - flash-sale-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flash-sale-redis-data:/data

  stock-reconciler:
    build:
      context: .
      dockerfile: backend/Dockerfile.reconcile-stock
    container_name: flash-sale-stock-reconciler
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RECONCILE_STOCK_INTERVAL_MS: 600000

volumes:
  flash-sale-postgres-data:
  flash-sale-redis-data:
