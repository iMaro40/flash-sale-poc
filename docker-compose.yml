services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale
    volumes:
      - flash-sale-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flash-sale-redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: flash-sale-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - flash-sale-rabbitmq-data:/var/lib/rabbitmq

  stock-reconciler:
    build:
      context: .
      dockerfile: backend/Dockerfile.reconcile-stock
    container_name: flash-sale-stock-reconciler
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RECONCILE_STOCK_INTERVAL_MS: 600000

  purchase-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.purchase-worker
    container_name: flash-sale-purchase-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      PURCHASE_WORKER_PREFETCH: 10

volumes:
  flash-sale-postgres-data:
  flash-sale-redis-data:
  flash-sale-rabbitmq-data:

